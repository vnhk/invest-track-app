columns:
  - field: name
    displayName: "Name"
    internalName: "name"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    min: 3
    max: 255

  - field: realEstateType
    displayName: "Type"
    internalName: "realEstateType"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    strValues: ["Apartment", "House", "Plot", "Commercial", "Garage"]
    min: 3
    max: 255

  - field: description
    displayName: "Description"
    internalName: "description"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: address
    displayName: "Address"
    internalName: "address"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: purchasePrice
    displayName: "Purchase Price"
    internalName: "purchasePrice"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: NUMBER
    min: 1
    max: 100000000

  - field: purchaseDate
    displayName: "Purchase Date"
    internalName: "purchaseDate"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: DATE

  - field: purchaseCosts
    displayName: "Purchase Costs"
    internalName: "purchaseCosts"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    dataType: NUMBER
    min: 0
    max: 100000000

  - field: currentValue
    displayName: "Current Value"
    internalName: "currentValue"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: NUMBER
    min: 1
    max: 100000000