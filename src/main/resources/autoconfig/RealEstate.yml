columns:
  - field: name
    displayName: "Name"
    internalName: "name"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    min: 3
    max: 255

  - field: realEstateType
    displayName: "Type"
    internalName: "realEstateType"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    strValues: ["Apartment", "House", "Plot", "Commercial", "Garage"]
    min: 3
    max: 255

  - field: address
    displayName: "Address"
    internalName: "address"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: description
    displayName: "Description"
    internalName: "description"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: currentValue
    displayName: "Current Value"
    internalName: "currentValue"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER

  - field: initialValue
    displayName: "Initial Value"
    internalName: "initialValue"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER

  - field: returnRate
    displayName: "Return Rate (%)"
    internalName: "returnRate"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER