columns:
  - field: valuableType
    displayName: "Type"
    internalName: "valuableType"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    strValues: [ "Cash", "Gold", "Silver", "Jewelery", "Electronics", "Other", "Coins" ]
    min: 3
    max: 255

  - field: description
    displayName: "Description"
    internalName: "description"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: purchasePrice
    displayName: "Purchase Price"
    internalName: "purchasePrice"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    dataType: NUMBER
    min: 1
    max: 100000000

  - field: purchaseDate
    displayName: "Purchase Date"
    internalName: "purchaseDate"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    dataType: DATE

  - field: purchaseCosts
    displayName: "Purchase Costs"
    internalName: "purchaseCosts"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    dataType: NUMBER
    min: 1
    max: 100000000

  - field: currentValue
    displayName: "Current Value"
    internalName: "currentValue"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: NUMBER
    min: 1
    max: 100000000