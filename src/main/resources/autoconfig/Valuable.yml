columns:
  - field: name
    displayName: "Name"
    internalName: "name"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    min: 1
    max: 255

  - field: valuableType
    displayName: "Type"
    internalName: "valuableType"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    strValues: [ "Gold", "Silver", "Jewelery", "Electronics", "Other", "Coins" ]
    min: 3
    max: 255

  - field: description
    displayName: "Description"
    internalName: "description"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 512

  - field: currentValue
    displayName: "Current Value"
    internalName: "currentValue"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER

  - field: initialValue
    displayName: "Initial Value"
    internalName: "initialValue"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER

  - field: returnRate
    displayName: "Return Rate (%)"
    internalName: "returnRate"
    inSaveForm: false
    inEditForm: false
    inTable: true
    dataType: NUMBER