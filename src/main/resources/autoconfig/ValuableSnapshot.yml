columns:
  - field: snapshotDate
    displayName: "Snapshot Date"
    internalName: "snapshotDate"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: DATE

  - field: assetValue
    displayName: "Asset Value"
    internalName: "assetValue"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: true
    dataType: NUMBER
    min: 0
    max: 999999999.99

  - field: notes
    displayName: "Notes"
    internalName: "notes"
    inSaveForm: true
    inEditForm: true
    inTable: true
    required: false
    min: 0
    max: 5000
